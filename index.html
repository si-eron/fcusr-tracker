<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9A227">
<!-- Everything the app needs ships with it, so nothing external is allowed to load
     or run. Even if a crafted backup file slipped markup past the sanitiser, there
     is no way for it to pull in or execute a script. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  media-src 'self' blob: mediastream:;
  frame-src blob:;
  font-src 'self';
  connect-src 'self' https://*.supabase.co;
  base-uri 'none';
  form-action 'none'">
<meta name="description" content="Task tracker for the Filamer Christian University Student Republic — events, assignments, deadlines, and printable event task reports.">
<title>FCUSR Task Tracker</title>
<!-- ASSET VERSION: run `node tools/bump.js` after changing any CSS or JS.
     It moves every ?v= here and version.json together, so browsers fetch the
     new files and any tab still open is told a newer version exists. Editing
     one by hand and not the other is silent: everything looks right and half
     the council keeps running yesterday's app. -->
<link rel="stylesheet" href="assets/css/app.css?v=89">
<link rel="stylesheet" href="assets/css/print.css?v=89" media="print">
<link rel="icon" href="assets/img/fcusr-seal-small.png?v=89">
</head>
<!-- Shipped closed. The tab bar, the search and the settings button are markup,
     so they are on screen from the moment this file is parsed — before any
     script has decided who is looking. app.js takes this class off once it
     knows, which is the safe way round: if a script is slow, or blocked, or
     fails outright, the Republic's work stays behind the door instead of
     sitting open because nothing got as far as closing it. -->
<body class="is-gated">

<a class="skip-link" href="#view">Skip to content</a>

<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="#/overview">
      <!-- EMBLEM SLOT — upload the FCU seal / FCUSR triangle in Settings, or replace
           the inline SVG below with <img src="assets/img/fcusr-emblem.png" alt=""> -->
      <span class="emblem" id="emblem-slot" aria-hidden="true">
        <img src="assets/img/fcusr-seal-small.png?v=89" alt="">
      </span>
      <span class="brand-name">FCUSR Task Tracker</span>
    </a>
    <span class="appbar-spacer"></span>
    <!-- Whether this device is behind. Hidden entirely when there is no server
         to be behind of, so an offline council never sees a state it cannot act on. -->
    <button class="sync-state" id="sync-state" type="button" hidden aria-live="polite"></button>
    <button class="icon-btn" id="btn-search" type="button" aria-label="Search tasks, events and people" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <!-- Who is signed in, and the way out. A council runs on shared computers,
         and until this existed there was no way to leave one. -->
    <button class="icon-btn who-btn" id="btn-account" type="button" hidden
            aria-label="Your account" aria-haspopup="menu"></button>
    <a class="icon-btn" id="btn-settings" href="#/settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </div>
</header>

<nav class="tabs" aria-label="Main">
  <div class="tabs-inner" id="tabs">
    <a class="tab" href="#/overview" data-route="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Overview
    </a>
    <a class="tab" href="#/my-tasks" data-route="my-tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2v4M16 2v4"/></svg>
      My tasks
      <span class="count" id="tab-count" hidden></span>
    </a>
    <a class="tab" href="#/directives" data-route="directives">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>
      Directives
    </a>
    <a class="tab" href="#/letters" data-route="letters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/></svg>
      Letters
      <span class="count" id="tab-letters" hidden></span>
    </a>
    <a class="tab" href="#/events" data-route="events">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V19l-4-2-4 2-4-2-4 2z"/><path d="M8 9h8M8 13h5"/></svg>
      Events
    </a>
  </div>
</nav>

<main id="view" tabindex="-1"></main>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="overlay"></div>
